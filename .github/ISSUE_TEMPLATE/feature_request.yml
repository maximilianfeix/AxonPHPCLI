name: Feature request
description: Suggest a new provider, a tool to detect, or another improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the project setup or workflow this would help with.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What should AxonPHP CLI do?
      description: If you have a pipeline snippet in mind, include it.
    validations:
      required: true
