<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 452" width="860" height="452" role="img" aria-labelledby="title desc">
  <title id="title">Terminal session running axonphp ci:init github</title>
  <desc id="desc">The command prints the detected PHP versions, extensions and tools, then reports that .github/workflows/ci.yml was created.</desc>

  <rect width="860" height="452" rx="12" fill="#0f1226"/>
  <rect width="860" height="452" rx="12" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>
  <path d="M0 12 a12 12 0 0 1 12 -12 h836 a12 12 0 0 1 12 12 v28 h-860 z" fill="#191d38"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="20" r="6" fill="#febc2e"/>
  <circle cx="64" cy="20" r="6" fill="#28c840"/>
  <text x="430" y="25" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8a90b8">acme-app — axonphp</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#d7dbf5" xml:space="preserve">
    <text x="24" y="74"><tspan fill="#4fd8c4">$</tspan> vendor/bin/axonphp ci:init github</text>

    <text x="24" y="118" fill="#f0c674">AxonPHP CLI · GitHub Actions</text>
    <text x="24" y="140" fill="#f0c674">============================</text>

    <text x="32" y="184" fill="#5c6390">----------------- ----------------------------------------</text>
    <text y="206"><tspan x="41" fill="#7ee0a1">Project</tspan><tspan x="192">/home/you/acme-app</tspan></text>
    <text y="228"><tspan x="41" fill="#7ee0a1">PHP versions</tspan><tspan x="192">8.2, 8.3, 8.4, 8.5</tspan><tspan fill="#f0c674" dx="8">(from "php": "^8.2")</tspan></text>
    <text y="250"><tspan x="41" fill="#7ee0a1">Extensions</tspan><tspan x="192">intl, pdo</tspan></text>
    <text y="272"><tspan x="41" fill="#7ee0a1">Tests</tspan><tspan x="192">PHPUnit</tspan></text>
    <text y="294"><tspan x="41" fill="#7ee0a1">Static analysis</tspan><tspan x="192">PHPStan</tspan></text>
    <text y="316"><tspan x="41" fill="#7ee0a1">Code style</tspan><tspan x="192">PHP-CS-Fixer</tspan></text>
    <text x="32" y="338" fill="#5c6390">----------------- ----------------------------------------</text>

    <rect x="24" y="362" width="812" height="34" rx="4" fill="#1f8a4c"/>
    <text x="36" y="384" fill="#ffffff" font-weight="700">[OK] Created .github/workflows/ci.yml</text>

    <text x="32" y="426" fill="#8a90b8">Commit the file and push to see your first pipeline run.</text>
  </g>
</svg>
