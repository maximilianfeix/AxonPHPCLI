<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 32 32" width="32" height="32" role="img" aria-labelledby="title desc">
  <title id="title">AxonPHP CLI favicon</title>
  <desc id="desc">A small-size A with an outgoing signal and terminal node.</desc>
  <rect x="3.5" y="3.5" width="25" height="25" rx="6.5" fill="#E2E4EF"/>
  <!-- Wider legs and an enlarged terminal preserve the signal at sixteen pixels. -->
  <g fill="none" stroke="#1E2140" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8.5 22.5 L14 9.5 L19.5 22.5"/>
    <path d="M11 17.5 H23.5"/>
  </g>
  <circle cx="23.5" cy="17.5" r="3" fill="#1E2140"/>
</svg>
