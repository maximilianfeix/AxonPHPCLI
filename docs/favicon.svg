<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 16 16" width="16" height="16" role="img" aria-labelledby="title desc">
  <title id="title">AxonPHP CLI favicon</title>
  <desc id="desc">An A with an outgoing signal line inside a PHP-inspired capsule.</desc>
  <!-- The capsule uses the full width here: at sixteen pixels every pixel of the letter counts. -->
  <rect x="0" y="2" width="16" height="12" rx="6" fill="#4F5B93"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 11.5 L7.5 4.5 L11 11.5"/>
    <path d="M5.5 9 H13"/>
  </g>
</svg>
