<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="title">
  <title id="title">AxonPHP CLI logo</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8892BF"/>
      <stop offset="1" stop-color="#4F5B93"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#tile)"/>

  <!-- An "A" drawn as a signal path: it starts at one node, peaks, and ends in a passed check -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <path d="M35 92 L64 34 L93 92" stroke-width="10"/>
    <path d="M50 72 H78" stroke-width="7" stroke-opacity="0.55"/>
  </g>
  <circle cx="64" cy="34" r="10" fill="#ffffff"/>
  <circle cx="35" cy="92" r="10" fill="#ffffff"/>
  <circle cx="93" cy="92" r="15" fill="#ffffff"/>
  <path d="M86 92 l5 5 l9 -10" fill="none" stroke="#4F5B93" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
