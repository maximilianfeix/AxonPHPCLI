<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="title desc">
  <title id="title">From composer.json to a CI pipeline</title>
  <desc id="desc">AxonPHP reads PHP constraints, extensions and development tools from composer.json, derives a PHP 8.2–8.5 matrix, and writes the pipeline file for the selected CI provider: GitHub Actions, GitLab CI or Bitbucket Pipelines.</desc>
  <rect width="960" height="360" rx="16" fill="#1E2140"/>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#E2E4EF">
    <text x="24" y="48">01 / READ</text>
    <text x="360" y="48">02 / DERIVE</text>
    <text x="648" y="48">03 / WRITE</text>
  </g>
  <!-- One signal runs behind the cards; exposed spans terminate in larger round nodes. -->
  <path d="M304 224 H656" fill="none" stroke="#8892BF" stroke-width="8" stroke-linecap="round"/>
  <g fill="#1E2140" stroke="#8892BF" stroke-width="2">
    <rect x="24" y="72" width="288" height="264" rx="8"/>
    <rect x="360" y="72" width="240" height="264" rx="8"/>
    <rect x="648" y="72" width="288" height="264" rx="8"/>
    <path d="M24 144 H312 M360 144 H600 M648 144 H936" fill="none"/>
  </g>
  <g fill="#8892BF">
    <circle cx="352" cy="224" r="6.5"/>
    <circle cx="640" cy="224" r="6.5"/>
  </g>
  <g transform="translate(368 80) scale(0.5)">
    <rect x="14" y="14" width="100" height="100" rx="26" fill="#E2E4EF"/>
    <g fill="none" stroke="#1E2140" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
      <path d="M35 88 L56 38 L77 88"/>
      <path d="M44 70 H91"/>
    </g>
    <circle cx="91" cy="70" r="10" fill="#1E2140"/>
  </g>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">
    <text x="440" y="120">AxonPHP</text>
    <text x="664" y="120">Pipeline file</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="40" y="120" font-size="20" font-weight="700" fill="#FFFFFF">composer.json</text>
    <g font-size="15" fill="#E2E4EF">
      <text x="40" y="170">"require": {</text>
      <text x="56" y="191">"php": "^8.2",</text>
      <text x="56" y="212">"ext-intl": "*"</text>
      <text x="40" y="233">},</text>
      <text x="40" y="254">"require-dev": {</text>
      <text x="56" y="275">"phpunit/phpunit": "^11",</text>
      <text x="56" y="296">"phpstan/phpstan": "^2"</text>
      <text x="40" y="317">}</text>
    </g>
  </g>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <g font-size="15" fill="#E2E4EF">
      <text x="376" y="168">PHP MATRIX</text>
      <text x="376" y="216">EXTENSIONS</text>
      <text x="376" y="264">TOOLS</text>
    </g>
    <g font-size="17" fill="#FFFFFF">
      <text x="376" y="192">PHP 8.2–8.5</text>
      <text x="376" y="240">intl</text>
      <text x="376" y="288">PHPUnit, PHPStan</text>
    </g>
    <g font-size="17" font-weight="600" fill="#FFFFFF">
      <text x="664" y="168">GitHub Actions</text>
      <text x="664" y="216">GitLab CI</text>
      <text x="664" y="264">Bitbucket Pipelines</text>
    </g>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#E2E4EF">
    <text x="664" y="192">.github/workflows/ci.yml</text>
    <text x="664" y="240">.gitlab-ci.yml</text>
    <text x="664" y="288">bitbucket-pipelines.yml</text>
  </g>
</svg>
